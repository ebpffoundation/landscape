name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Type-check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # GHSA-g3hv-75wg-m249 flags minimatch@3.1.5, which lacks the vulnerable code
      # (isaacs/minimatch#333). Revert to `npm audit --audit-level=low` once the
      # advisory range is corrected; this step fails as soon as it is.
      - name: Audit dependencies
        run: |
          skip=GHSA-g3hv-75wg-m249
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          jq -e --arg skip "$skip" '
            [.vulnerabilities[].via[] | objects
              | select(.severity != "info") | .url | split("/")[-1]]
            | unique | . == [$skip]' "$RUNNER_TEMP/audit.json" || {
            echo "::error::Audit findings are not exactly $skip. If the report below is clean, revert this step to npm audit --audit-level=low."
            npm audit
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
